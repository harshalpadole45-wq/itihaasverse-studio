<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ItihaasVerse Studio</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#171c1d;color:#f5ead8;
 font-family:Arial,sans-serif;padding:16px
}
header{
 text-align:center;background:#391b25;
 padding:25px 10px;border-radius:14px;
 border:1px solid #bd9656
}
h1{color:#d5ae69;letter-spacing:3px}
header p{color:#e4d5bd}
.card{
 background:#203c3b;padding:17px;
 border-radius:12px;margin-top:16px
}
h2{color:#e1b96f}
label{display:block;margin:14px 0 7px}
input,textarea{
 width:100%;padding:12px;border-radius:7px;
 border:1px solid #b79b70;background:#f5ead8;
 color:#222;font-size:15px
}
textarea{resize:vertical}
button{
 background:#c59c59;color:#211b15;
 border:0;border-radius:7px;
 padding:11px 15px;margin:7px 4px 0 0;
 font-weight:bold
}
button:disabled{opacity:.4}
#stage{
 width:min(100%,360px);aspect-ratio:9/16;
 margin:15px auto;background:#101515;
 border:2px solid #c59c59;
 border-radius:8px;position:relative;
 overflow:hidden;display:flex;
 align-items:center;justify-content:center
}
#scene{
 width:100%;height:100%;object-fit:cover;
 display:none
}
#caption{
 position:absolute;bottom:35px;
 left:8px;right:8px;text-align:center;
 background:#101515bb;color:white;
 padding:12px;font-size:18px;
 line-height:1.5
}
#thumbs{
 display:flex;gap:9px;overflow-x:auto;
 margin-top:12px
}
#thumbs img{
 width:85px;height:120px;
 object-fit:cover;border:2px solid #c59c59;
 border-radius:5px
}
.small{color:#d6c5a9;font-size:13px}
</style>
</head>
<body>

<header>
<h1>ITIHAASVERSE</h1>
<p>History • Heritage • Stories</p>
<p>YOUR CREATIVE VIDEO STUDIO</p>
</header>

<div class="card">
<h2>01. Narration</h2>
<label>Upload voice recording</label>
<input type="file" id="audioFile" accept="audio/*">
<audio id="audio" controls style="width:100%;margin-top:15px"></audio>
</div>

<div class="card">
<h2>02. Scene Images</h2>
<label>Upload multiple images</label>
<input type="file" id="imageFiles" accept="image/*" multiple>
<div id="thumbs"></div>
<p class="small" id="imageCount">No images uploaded yet.</p>
<button id="prev">Previous scene</button>
<button id="next">Next scene</button>
</div>

<div class="card">
<h2>03. Your Story</h2>
<label>Hindi script</label>
<textarea id="script" rows="5"
placeholder="अपनी कहानी यहाँ लिखें..."></textarea>

<label>English subtitles</label>
<textarea id="subtitle" rows="3"
placeholder="Enter your English subtitles..."></textarea>

<button id="showText">Update preview text</button>
</div>

<div class="card">
<h2>04. Video Preview</h2>
<p class="small">Vertical video format • 9:16</p>

<div id="stage">
<img id="scene" alt="Selected scene">
<div id="caption">Your subtitles appear here</div>
</div>

<p class="small" id="sceneNumber">Scene 0</p>
</div>

<footer style="text-align:center;padding:25px;color:#c59c59">
ITIHAASVERSE STUDIO © 2026
</footer>

<script>
const audioFile=document.getElementById('audioFile');
const audio=document.getElementById('audio');
const imageFiles=document.getElementById('imageFiles');
const scene=document.getElementById('scene');
const thumbs=document.getElementById('thumbs');
const caption=document.getElementById('caption');
const sceneNumber=document.getElementById('sceneNumber');

let images=[];
let current=0;

audioFile.addEventListener('change',()=>{
 const file=audioFile.files[0];
 if(file){
  audio.src=URL.createObjectURL(file);
 }
});

imageFiles.addEventListener('change',()=>{
 images.forEach(item=>URL.revokeObjectURL(item.url));
 images=[];
 thumbs.innerHTML='';
 current=0;

 Array.from(imageFiles.files).forEach(file=>{
  if(!file.type.startsWith('image/'))return;
  const url=URL.createObjectURL(file);
  images.push({url,name:file.name});

  const thumb=document.createElement('img');
  thumb.src=url;
  thumb.alt=file.name;
  thumb.addEventListener('click',()=>{
   current=images.findIndex(item=>item.url===url);
   updateScene();
  });
  thumbs.appendChild(thumb);
 });

 updateScene();
 document.getElementById('imageCount').textContent=
 images.length+' images uploaded.';
});

function updateScene(){
 if(!images.length){
  scene.style.display='none';
  scene.removeAttribute('src');
  sceneNumber.textContent='Scene 0';
  return;
 }

 scene.src=images[current].url;
 scene.style.display='block';
 sceneNumber.textContent=
 'Scene '+(current+1)+' of '+images.length;
}

document.getElementById('prev').onclick=()=>{
 if(images.length){
  current=(current-1+images.length)%images.length;
  updateScene();
 }
};

document.getElementById('next').onclick=()=>{
 if(images.length){
  current=(current+1)%images.length;
  updateScene();
 }
};

document.getElementById('showText').onclick=()=>{
 const text=document.getElementById('subtitle').value.trim();
 caption.textContent=text||'Your subtitles appear here';
};
</script>

</body>
</html>
